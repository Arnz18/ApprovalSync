# ==============================================================================
# ApprovalSync Frontend — Production Nginx Configuration
# Reverse Proxy & Static SPA Server
# Milestone: DEP-01
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum upload body size for statutory documents (PDF/images up to 15MB + multipart overhead)
    client_max_body_size 25M;

    # Gzip Compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Production Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness health check probe endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Docker embedded DNS resolver (127.0.0.11) with short TTL to handle container restarts/IP changes dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    # Reverse proxy for Backend API routes (/api/)
    # Forwards requests to backend service on internal Docker network
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # Client identity and protocol forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection upgrade support (WebSocket / SSE if used)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeouts for document OCR, duplicate scans, and Merkle proof generation
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Proxy buffer optimization
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Static Vite assets (fingerprinted/hashed bundles in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Single Page Application (SPA) routing
    # Fallback all unrecognized routes to index.html for client-side React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
