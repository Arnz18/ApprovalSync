<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><path d='M16 3L5 7.5V14.5C5 21.2 9.7 27.4 16 29C22.3 27.4 27 21.2 27 14.5V7.5L16 3Z' fill='%231E3A8A' stroke='%233B82F6' stroke-width='2'/><path d='M9 19.5C11 16.5 13.2 15 16 15C18.8 15 21 16.5 23 19.5' stroke='white' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='10.5' r='2' fill='%2360A5FA'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NiyamSetu — Integrated AICTE Approval Workflow Automation, Scrutiny Management, EVC Inspection Scheduling, and Compliance Monitoring System." />
    <title>NiyamSetu — Approval &amp; Compliance Management System</title>
    <!-- Modern Typography: Lexend (Headings) + Source Sans 3 (Body) from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Prevent Theme Flash (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('niyamsetu_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
