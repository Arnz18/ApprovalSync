name: approvalsync

services:
  postgres:
    image: postgres:16-alpine
    container_name: approvalsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-approvalsync}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-approvalsync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: approvalsync_postgres_data
