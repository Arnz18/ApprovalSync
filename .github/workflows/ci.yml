name: CI Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality-gates:
    name: Backend Build, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: approvalsync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: approvalsync
      DB_USER: postgres
      DB_PASSWORD: postgres_dev_password
      JWT_SECRET: dev_synthetic_jwt_signing_secret_min_32_characters_for_local_demo_only
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint codebase (ESLint)
        run: npm run lint

      - name: Build backend application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run database migrations
        run: npm run migration:run

      - name: Seed test data
        run: npm run seed

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

  frontend-quality-gates:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint codebase (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit & component tests
        run: npm test

      - name: Build frontend application
        run: npm run build
